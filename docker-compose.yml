services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: "8787"
      DATA_DIR: /data
    volumes:
      - db:/data
    restart: unless-stopped

  web:
    build: .
    ports:
      - "9994:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db:
