<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepBurrow — Offline</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #faf9f7;
        color: #191622;
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 28rem; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { margin: 16px 0 8px; font-size: 1.25rem; }
      p { margin: 0; color: #6b6577; }
      a { display: inline-block; margin-top: 20px; color: #047857; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" width="72" height="72" />
      <h1>You’re offline</h1>
      <p>
        Signing in, loading a burrow, asking questions, receiving answers and completion
        notifications all need a connection. Nothing was queued.
      </p>
      <a href="/app">Try again</a>
    </main>
  </body>
</html>
