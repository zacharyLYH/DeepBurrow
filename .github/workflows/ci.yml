name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Pin Chromium, fonts and Node so screenshot drift comes from the app,
    # not from runner-image updates. Local uses the same baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web
        run: npm run build

      # Boots the real API (:8787) and Vite (:5173) via playwright.config.ts.
      - name: End-to-end tests
        run: npm test

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker build + stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Generate a temporary auth secret
        run: echo "AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Smoke the stack
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:9994/api/health; then
              curl -fsS http://localhost:9994/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker compose logs --tail=200
          exit 1

      - name: Stop the stack
        if: always()
        run: docker compose down -v
